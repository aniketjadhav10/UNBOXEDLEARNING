<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UnBoxed Learning — Offline</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f7f4ef; color: #2e2140; text-align: center; padding: 24px;
  }
  .card { max-width: 360px; }
  .icon {
    width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 20px;
    background: linear-gradient(135deg, #a78bfa, #7c3aed);
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: #6b6478; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #3d2a52; color: #fff; border: none; border-radius: 10px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon"></div>
    <h1>You're offline</h1>
    <p>This page hasn't been saved for offline use yet. Reconnect to load it, or open a page you've already visited.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
